<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConceptLens – AI Learning Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-start justify-start">
    <div class="mouse-glow"></div>
    <div class="scan-line"></div>

    <!-- Top Navigation -->
    <nav class="absolute top-0 left-0 right-0 p-12 lg:px-24 flex justify-between items-center w-full max-w-7xl mx-auto z-50 fade-in">
        <div class="text-xl font-bold tracking-tight cursor-pointer flex items-center gap-3" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 bg-gradient-to-br from-pink-500 to-blue-500 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-pink-500/20">🧠</div>
            <span>ConceptLens</span>
        </div>
        <a href="about.html" class="nav-link text-xs font-bold text-gray-400 hover:text-white uppercase tracking-widest transition-colors duration-300">About</a>
    </nav>

    <main class="grid grid-cols-1 lg:grid-cols-2 gap-20 w-full max-w-7xl mx-auto px-12 md:px-16 lg:px-24 py-40 items-center">
        <!-- LEFT SIDE: Content (Aligned Left) -->
        <div class="flex flex-col items-start text-left space-y-12 fade-in" style="animation-delay: 0.2s;">
            <div class="space-y-6">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                    <p class="text-blue-400 text-xs font-black uppercase tracking-[0.3em]">AI-Powered Knowledge Audit</p>
                </div>
                <h1 class="text-6xl md:text-8xl headline-photo">
                    Know What You <br> <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-500 hover:drop-shadow-[0_0_15px_rgba(255,51,153,0.5)] transition-all duration-500">Don't Understand.</span>
                </h1>
            </div>

            <div class="space-y-8 max-w-xl">
                <p class="text-gray-400 text-lg md:text-xl leading-relaxed font-light">
                    Stop guessing your preparation. ConceptLens quantifies your understanding, transforming ambiguity into precision insights.
                </p>
                <div class="flex flex-col space-y-3">
                    <p class="text-gray-300 font-bold text-sm uppercase tracking-widest flex items-center gap-3">
                        <span class="text-pink-500">→</span> Diagnose Weak Areas
                    </p>
                    <p class="text-gray-300 font-bold text-sm uppercase tracking-widest flex items-center gap-3">
                        <span class="text-pink-500">→</span> Quantify Concept Mastery
                    </p>
                </div>
            </div>

            <div class="pt-6">
                <button onclick="window.location.href='subjects.html'" class="relative group bg-gradient-to-r from-pink-500 to-rose-600 text-white px-12 py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] glow-pulse btn-hover shadow-xl overflow-hidden">
                    <span class="relative z-10">Begin Mastery Session</span>
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                </button>
            </div>
        </div>

        <!-- RIGHT SIDE: Mascot -->
        <div class="relative flex justify-center items-center fade-in" style="animation-delay: 0.4s;">
            <!-- Subtle Background Glow -->
            <div class="absolute inset-0 mascot-glow rounded-full scale-125"></div>

            <!-- Mascot SVG -->
            <div class="float relative z-10 w-full max-w-md">
                <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
                    <!-- Outer Glow Effect for Mascot -->
                    <defs>
                        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="5" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- Body -->
                    <rect x="130" y="320" width="140" height="130" rx="50" fill="#FFFFFF" />
                    
                    <!-- Hoodie/Head -->
                    <path d="M110 340 C110 210, 290 210, 290 340" fill="#FFFFFF" />
                    
                    <!-- Ears -->
                    <!-- Left Ear -->
                    <path d="M150 230 C120 120, 180 120, 185 230" fill="#FFFFFF" />
                    <!-- Right Ear -->
                    <path d="M215 230 C220 120, 280 120, 250 230" fill="#FFFFFF" />
                    
                    <!-- Bow on left ear -->
                    <g transform="translate(145, 235) rotate(-20)">
                        <path d="M-12 -8 Q0 0 -12 8 L12 8 Q0 0 12 -8 Z" fill="#FF2E88" />
                        <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
                    </g>

                    <!-- Face Area -->
                    <path d="M145 285 Q200 260 255 285 Q270 330 255 375 Q200 400 145 375 Q130 330 145 285" fill="#F8F8F8" />
                    
                    <!-- Blush -->
                    <circle cx="165" cy="355" r="8" fill="#FF2E88" fill-opacity="0.1" />
                    <circle cx="235" cy="355" r="8" fill="#FF2E88" fill-opacity="0.1" />

                    <!-- Eyes -->
                    <ellipse cx="175" cy="335" rx="14" ry="16" fill="#1A1A1A" />
                    <ellipse cx="225" cy="335" rx="14" ry="16" fill="#1A1A1A" />
                    <!-- Eye Highlights -->
                    <circle cx="178" cy="328" r="5" fill="#FFFFFF" />
                    <circle cx="228" cy="328" r="5" fill="#FFFFFF" />
                    <circle cx="172" cy="342" r="2" fill="#FFFFFF" fill-opacity="0.5" />
                    <circle cx="222" cy="342" r="2" fill="#FFFFFF" fill-opacity="0.5" />

                    <!-- Nose -->
                    <path d="M197 352 Q200 355 203 352" stroke="#1A1A1A" stroke-width="2" fill="none" />

                    <!-- Heart on Chest -->
                    <path d="M200 415 Q200 415, 192 407 Q185 400 192 395 Q200 392 200 400 Q200 392 208 395 Q215 400 208 407 Q200 415 200 415" fill="#FF2E88" />
                    
                    <!-- Paws (tucked in like the sketch) -->
                    <rect x="120" y="380" width="25" height="40" rx="12" fill="#FFFFFF" />
                    <rect x="255" y="380" width="25" height="40" rx="12" fill="#FFFFFF" />
                    
                    <!-- Feet -->
                    <rect x="150" y="450" width="45" height="30" rx="15" fill="#FFFFFF" />
                    <rect x="205" y="450" width="45" height="30" rx="15" fill="#FFFFFF" />
                </svg>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            document.documentElement.style.setProperty('--mouse-x', `${x}px`);
            document.documentElement.style.setProperty('--mouse-y', `${y}px`);
        });

        document.addEventListener('DOMContentLoaded', () => {
            console.log('ConceptLens Landing Page Loaded');
        });
    </script>
</body>
</html>
