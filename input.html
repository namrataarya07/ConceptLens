<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Syllabus – ConceptLens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen">
    <!-- LEFT SIDEBAR -->
    <aside class="w-1/5 border-r border-white/5 flex flex-col p-10 space-y-16 z-20 bg-black/50 backdrop-blur-xl">
        <div class="text-xl font-bold tracking-tight cursor-pointer" onclick="window.location.href='index.html'">
            ConceptLens <span class="text-2xl">🧠</span>
        </div>

        <nav class="flex flex-col space-y-8 flex-grow">
            <div class="space-y-6">
                <a href="subjects.html" class="sidebar-item active flex items-center gap-3 text-lg font-medium group">
                    <span class="text-xl">📚</span> Subjects
                </a>
                <a href="revision.html" class="sidebar-item flex items-center gap-3 text-lg font-light text-gray-500 hover:text-white group">
                    <span class="text-xl">📘</span> Revision
                </a>
                <a href="subjects.html?view=progress" class="sidebar-item flex items-center gap-3 text-lg font-light text-gray-500 hover:text-white group">
                    <span class="text-xl">📊</span> Dashboard
                </a>
                <a href="profile.html" class="sidebar-item flex items-center gap-3 text-lg font-light text-gray-500 hover:text-white group">
                    <span class="text-xl">👤</span> Profile
                </a>
                <a href="profile.html?openSettings=true" class="sidebar-item flex items-center gap-3 text-lg font-light text-gray-500 hover:text-white group">
                    <span class="text-xl">⚙️</span> Settings
                </a>
            </div>
        </nav>
    </aside>

    <!-- RIGHT MAIN CONTENT -->
    <main class="flex-grow flex flex-col relative overflow-y-auto">
        <!-- Top Nav -->
        <header class="p-10 flex justify-end items-center">
            <a href="about.html" class="nav-link relative text-sm font-light text-gray-400 hover:text-white transition-colors duration-300">About</a>
        </header>

        <!-- Center Content -->
        <section class="flex-grow flex flex-col items-center justify-center max-w-3xl mx-auto w-full px-10 pb-20">
            <div class="text-center space-y-4 mb-12 fade-in">
                <h1 class="text-4xl md:text-5xl font-bold tracking-tight">Upload Anything and Master It.</h1>
                <p class="text-gray-400 text-lg md:text-xl font-light">Enter your syllabus or provide learning material</p>
            </div>

            <div class="w-full space-y-8 fade-in" style="animation-delay: 0.2s;">
                <!-- 1. TEXT INPUT -->
                <div class="space-y-3">
                    <div class="input-box rounded-2xl p-1 overflow-hidden">
                        <textarea 
                            class="w-full h-40 bg-transparent p-6 text-white placeholder-gray-600 focus:outline-none resize-none text-lg"
                            placeholder="e.g. COD, Hazardous Waste, Electronic Devices for Particulate Matter"
                        ></textarea>
                    </div>
                    <!-- Smart Hint -->
                    <p class="suggestion-hint text-[#38BDF8] text-sm font-medium pl-2">
                        Try: COD, Hazardous Waste, Electronic Devices for Particulate Matter
                    </p>
                </div>

                <!-- 2. OPTION BUTTONS -->
                <div class="flex flex-col space-y-3">
                    <!-- Small Demo Topics Button Above -->
                    <div class="flex justify-start mb-1">
                        <button onclick="document.querySelector('textarea').value = 'COD, Hazardous Waste, Electronic Devices for Particulate Matter'" class="px-3 py-1.5 rounded-lg border border-white/10 bg-white/5 hover:bg-[#38BDF8]/10 hover:border-[#38BDF8]/30 transition-all group flex items-center gap-2">
                            <span class="text-xs text-gray-500 group-hover:text-[#38BDF8] font-medium tracking-wide italic">✨ Use demo topics</span>
                        </button>
                    </div>

                    <button class="option-btn p-5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center gap-4">
                            <span class="text-xl">✍️</span>
                            <span class="font-medium">Type your syllabus</span>
                        </div>
                        <span class="text-[#FF2E88] opacity-0 group-hover:opacity-100 transition-opacity">PRIMARY</span>
                    </button>
                    
                    <button class="option-btn p-5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center gap-4">
                            <span class="text-xl">📁</span>
                            <span class="font-medium">Upload your notes</span>
                        </div>
                        <span class="text-gray-600 group-hover:text-[#FF2E88] transition-colors">PDF / DOCX</span>
                    </button>
                    <button class="option-btn p-5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center gap-4">
                            <span class="text-xl">🔗</span>
                            <span class="font-medium">Link of YouTube/web</span>
                        </div>
                        <span class="text-gray-600 group-hover:text-[#FF2E88] transition-colors">URL</span>
                    </button>
                </div>

                <!-- 3. START BUTTON -->
                <div class="pt-6 flex justify-center">
                    <button 
                        onclick="window.location.href='mode.html'" 
                        class="bg-[#FF2E88] text-white px-16 py-5 rounded-2xl font-bold text-xl glow-pulse transition-all duration-300 hover:scale-105 active:scale-95"
                    >
                        Start Audit
                    </button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
